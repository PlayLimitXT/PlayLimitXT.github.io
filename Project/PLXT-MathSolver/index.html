<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#eef2f8">
<meta name="application-name" content="PLXT MathSolver">
<meta name="plxt-version" content="1.0.0">
<meta name="description" content="PLXT MathSolver - offline structured math editor and solver with exact, verified step-by-step solutions. 离线结构化数学求解器。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="color-scheme" content="light">
<meta name="description" content="PLXT MathSolver - visual structured math input with fixed keypad and typeset solutions.">
<title>PLXT MathSolver</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/math.css">
<meta name="author" content="PlayLimitXT,PlayLimitXT@gmail.com">
<meta name="copyright" content="Copyright © 2026 PlayLimitXT">
<meta name="robots" content="index,follow" />
<meta name="revisit-after" content="7 days" >
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H1BZQVCCRE"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-H1BZQVCCRE');
</script>
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand-lock">
      <img class="brand-logo" id="brandLogo" src="assets/brand.svg"
           alt="PLXT MathSolver" aria-label="PLXT MathSolver">
      <span class="brand-name">PLXT MathSolver</span>
    </div>
    <div class="top-spacer"></div>
    <button type="button" class="keypad-toggle" id="btnKeypad">⌨ <span id="keypadLabel">收起键盘</span></button>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="切换主题" title="切换主题">☾</button>
    <button type="button" class="lang-btn" id="langBtn">EN</button>
  </header>

  <!-- The formula is a tree of clickable boxes; there is no text input anywhere. -->
  <section class="display" id="display">
    <div class="display-inner">
      <div class="display-math" id="editorHost"></div>
      <div class="display-empty" id="displayEmpty" data-i18n="display.empty" hidden></div>
    </div>
  </section>

  <!-- Only this region scrolls. -->
  <section class="result" id="resultScroll">
    <div class="result-inner" id="resultInner">

      <div class="intents" id="intentsBar" hidden></div>
      <div class="intent-title" id="intentTitle" hidden></div>
      <div class="intent-hint" id="intentHint" hidden></div>

      <div class="notice-card" id="noticeCard" hidden></div>

      <div class="answer-card" id="answerCard" aria-live="polite">
        <div class="answer-label" data-i18n="result.answer">答案</div>
        <div class="answer-math" id="answerMath"></div>
        <div class="answer-approx" id="answerApprox" hidden></div>
        <div class="answer-series" id="answerSeries" hidden></div>
        <div class="answer-meta" id="answerMeta"></div>
      </div>

      <div class="error-card" id="errorCard" role="alert" hidden></div>

      <div class="actions" id="actions">
        <button type="button" class="action" id="btnSteps" aria-expanded="false" data-i18n="btn.steps">解题步骤</button>
        <button type="button" class="action" id="btnGraph" aria-expanded="false" data-i18n="btn.graph">函数图像</button>
        <button type="button" class="action" id="btnCopy" data-i18n="btn.copy">复制</button>
        <button type="button" class="action" id="btnReuse" data-i18n="btn.reuse">复用结果</button>
      </div>

      <!-- Collapsed by default. Opening it never focuses the textarea, so the
           on-screen/system keyboard is not raised until the user taps it. -->
      <div class="advanced" id="advanced">
        <button type="button" class="advanced-toggle" id="btnAdvanced"
                aria-expanded="false" aria-controls="advancedPanel">
          <span class="adv-caret">▸</span><span data-i18n="advanced.toggle">高级选项 · LaTeX</span>
        </button>
        <div class="advanced-panel" id="advancedPanel" hidden>
          <div class="advanced-head">
            <label for="latexInput" data-i18n="advanced.label">LaTeX 源码</label>
            <span class="latex-status" id="latexStatus"></span>
          </div>
          <textarea id="latexInput" class="latex-input" rows="3" spellcheck="false"
                    autocomplete="off" autocapitalize="off" autocorrect="off"
                    aria-label="LaTeX"></textarea>
          <div class="latex-preview" id="latexPreview" aria-live="polite"></div>
          <div class="advanced-actions">
            <button type="button" class="action" id="btnLatexApply" data-i18n="advanced.apply">应用到输入区</button>
            <button type="button" class="action" id="btnLatexCopy" data-i18n="advanced.copy">复制</button>
            <button type="button" class="action" id="btnLatexPaste" data-i18n="advanced.paste">粘贴</button>
            <button type="button" class="action" id="btnLatexRefresh" data-i18n="advanced.refresh">从输入区刷新</button>
          </div>
          <div class="advanced-hint" data-i18n="advanced.hint"></div>
        </div>
      </div>

      <div class="method-row" id="methodRow" hidden>
        <label for="methodSelect" data-i18n="result.method">解法</label>
        <select id="methodSelect" class="method-select"></select>
      </div>

      <div id="stepsSection" hidden></div>
      <div id="graphSection" hidden></div>

    </div>
  </section>

  <!-- Permanently fixed keypad. -->
  <section class="keypad" id="keypad">
    <div class="keypad-tools" id="keypadTools" role="toolbar"></div>
    <div class="keypad-tabs" id="keypadTabs" role="tablist"></div>
    <div class="keypad-grid" id="keypadGrid"></div>
    <div class="solve-wrap">
      <button type="button" class="solve-bar" id="btnSolve" data-i18n="btn.solve">求解</button>
    </div>
  </section>

  <div class="keypad-reopen" id="btnKeypadOpen" role="button" tabindex="0">⌨ 显示键盘</div>

</div>

<noscript>
  <div class="noscript">PLXT MathSolver 需要启用 JavaScript 才能运行。<br>
  JavaScript is required to run PLXT MathSolver.</div>
</noscript>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/mathjs/math.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/model.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/keypad.js"></script>
<script src="js/solver.js"></script>
<script src="js/exact.js"></script>
<script src="js/augment.js"></script>
<script src="js/plot.js"></script>
<script src="js/latex.js"></script>
<script src="js/app.js"></script>
</body>
</html>
