    <script>
      /* First-paint guard: apply the saved appearance before deferred scripts run to
   avoid a flash of the wrong theme. Brand text is populated by 09-plus.js at
   the end of the deferred sequence from window.PLXT_BRAND. */
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('ai-chat-pro-v3') || '{}').settings || {};
          var mode = s.mode || 'dark';
          if (mode === 'auto')
            mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.body.classList.toggle('light', mode === 'light');
          var alias = { openai: 'ink', studio: 'prism', mono: 'slate', custom: 'bespoke' };
          var d = alias[s.design] || s.design;
          if (['neon', 'ink', 'prism', 'aurora', 'slate', 'bespoke'].indexOf(d) >= 0) document.body.dataset.design = d;
          var m = document.querySelector('meta[name=theme-color]');
          if (m)
            m.content =
              mode === 'light'
                ? d === 'neon'
                  ? '#f6f4ff'
                  : d === 'aurora'
                    ? '#f4f5fd'
                    : '#ffffff'
                : d === 'neon'
                  ? '#080a16'
                  : d === 'aurora'
                    ? '#0a0c19'
                    : d === 'prism'
                      ? '#131314'
                      : d === 'slate'
                        ? '#18181b'
                        : '#171717';
        } catch (e) {}
      })();
    </script>

          </div>

          <div class="inline-search" id="chatSearchBar" hidden>
            <svg><use href="#i-search" /></svg><input id="chatSearchInput" placeholder="在当前会话中搜索…" />
            <span class="tiny" id="chatSearchCount"></span>
            <button class="icon-btn" id="btnCloseChatSearch">
              <svg><use href="#i-close" /></svg>
            </button>
          </div>

          <!-- Message area: buttons sit in a non-scrolling wrapper so absolute positioning neither scrolls with content nor covers text. -->
          <div class="messages-wrap">
            <div class="messages" id="messages" aria-live="polite" aria-atomic="false">
              <div class="empty-state" id="emptyState">
                <div class="empty-logo" aria-hidden="true">
                  <img class="brand-logo brand-logo-lg" src="logo.svg" alt="" width="54" height="54" />
                </div>
                <h2 id="emptyTitle">有什么可以帮忙的？</h2>
                <p id="emptyDesc">配置好模型后即可开始。也可以从下面的示例提示词开始。</p>
                <div class="starter-grid" id="starterPrompts"></div>
                <div class="empty-hint" id="emptyHint"></div>
              </div>
            </div>
            <button class="scroll-bottom" id="btnScrollBottom" hidden type="button" aria-label="回到最新">
              <svg><use href="#i-arrow-down" /></svg><span>回到最新</span>
            </button>
          </div>

          <!-- Composer -->
          <div class="composer-wrap">
            <div class="attachment-bar" id="attachmentBar" hidden></div>
            <div class="reply-bar" id="replyBar" hidden>
              <span id="replyLabel"></span
              ><button class="icon-btn" id="btnCancelReply">
                <svg><use href="#i-close" /></svg>
              </button>
            </div>

            <div class="composer" id="composer">
              <div class="composer-tools" id="composerTools">
                <button class="tool-btn" id="btnAttach" title="附件">
                  <svg><use href="#i-paperclip" /></svg><span>附件</span>
                </button>
                <input
                  type="file"
                  id="fileInput"
                  multiple
                  hidden
                  accept="image/*,.txt,.md,.json,.jsonl,.csv,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,.pdf,.docx,.epub,.pptx,.xlsx"
                />
                <button class="tool-btn" id="btnVoice" title="语音输入">
                  <svg><use href="#i-mic" /></svg><span>语音</span>
                </button>
                <button class="tool-btn tool-secondary" id="btnScreenshot" title="截图">
                  <svg><use href="#i-image" /></svg><span>截图</span>
                </button>
                <span class="tool-sep"></span>
                <button class="tool-btn toggle" id="btnWebSearch" title="联网搜索">
                  <svg><use href="#i-globe" /></svg><span>联网</span>
                </button>
                <button class="tool-btn toggle" id="btnMcp" title="工具调用">
                  <svg><use href="#i-plug" /></svg><span>工具</span>
                </button>
                <button class="tool-btn toggle" id="btnReasoning" title="展示思考过程">
                  <svg><use href="#i-brain" /></svg><span>思考</span>
                </button>
                <span class="tool-sep tool-secondary"></span>
                <button class="tool-btn tool-secondary" id="btnImageGen" title="文生图">
                  <svg><use href="#i-image" /></svg><span>生图</span>
                </button>
                <button class="tool-btn tool-secondary" id="btnRace" title="多模型对比">
                  <svg><use href="#i-bolt" /></svg><span>对比</span>
                </button>
                <button class="tool-btn tool-secondary" id="btnPromptQuick" title="提示词模板">
                  <svg><use href="#i-book" /></svg><span>模板</span>
                </button>
                <button class="tool-btn tool-secondary" id="btnFullEdit" title="全屏编辑">
                  <svg><use href="#i-expand" /></svg><span>展开</span>
                </button>
                <button class="tool-btn" id="btnToolsMore" title="更多工具" aria-expanded="false">
                  <svg><use href="#i-more" /></svg><span>更多</span>
                </button>
              </div>

              <textarea id="input" rows="1" placeholder="输入消息…  / 唤起命令"></textarea>

              <div class="composer-actions">
                <span class="tiny" id="draftInfo"></span>
                <span class="flex-spacer"></span>
                <button class="btn ghost" id="btnClearInput" title="清空输入">清空</button>
                <button class="btn danger" id="btnStop" hidden>
                  <svg><use href="#i-stop" /></svg><span>停止</span>
                </button>
                <button class="btn primary" id="btnSend">
                  发送 <svg><use href="#i-send" /></svg>
                </button>
              </div>
            </div>

            <div class="composer-foot">
              <span class="status-item"
                ><i class="status-dot" id="statusDot"></i><span id="statusText">就绪</span></span
              >
              <span id="tokenInfo"></span>
              <span class="foot-disclaimer">AI 生成内容请自行核对 · 数据仅保存在本机浏览器</span>
              <span class="foot-copy"></span>
            </div>
          </div>
        </main>

        <!-- ===================== Right: runtime parameter Inspector ===================== -->
        <aside class="inspector" id="inspector" hidden>
          <div class="inspector-head">
            <div class="inspector-title">
              <svg><use href="#i-sliders" /></svg><span>运行设置</span>
            </div>
            <div class="inspector-head-actions">
              <button class="icon-btn" id="btnInspectorSettings" title="全部设置">
                <svg><use href="#i-settings" /></svg>
              </button>
              <button class="icon-btn" id="btnCloseInspector" title="收起">
                <svg><use href="#i-close" /></svg>
              </button>
            </div>
          </div>
          <div class="inspector-tabs" id="inspectorTabs"></div>
          <div class="inspector-body" id="inspectorBody"></div>
        </aside>
      </div>

      <!-- Mobile bottom shortcut bar -->
      <nav class="mobile-tabbar" id="mobileTabbar">
        <button data-mobile="new">
          <svg><use href="#i-plus" /></svg><span>新对话</span>
        </button>
        <button data-mobile="history">
          <svg><use href="#i-menu" /></svg><span>会话</span>
        </button>
        <button data-mobile="inspector">
          <svg><use href="#i-sliders" /></svg><span>参数</span>
        </button>
        <button data-mobile="commands">
          <svg><use href="#i-search" /></svg><span>命令</span>
        </button>
      </nav>
    </div>

    <!-- ===================== Overlays ===================== -->
    <div class="popover" id="popover" hidden></div>
    <div class="cmd-palette" id="cmdPalette" hidden>
      <div class="cmd-input">
        <svg><use href="#i-search" /></svg><input id="cmdInput" placeholder="搜索命令、会话、模型、提示词…" /><kbd
          >Esc</kbd
        >
      </div>
      <div class="cmd-list" id="cmdList"></div>
      <div class="cmd-foot">↑↓ 选择 · Enter 执行 · Ctrl/⌘+K 打开</div>
    </div>
    <div class="drawer-root" id="drawerRoot" hidden>
      <div class="drawer-mask" id="drawerMask"></div>
      <section class="drawer" id="drawer">
        <div class="drawer-head">
          <h3 id="drawerTitle">设置</h3>
          <div class="drawer-head-actions">
            <button class="icon-btn" id="btnDrawerExpand" title="加宽">
              <svg><use href="#i-expand" /></svg></button
            ><button class="icon-btn" id="btnCloseDrawer">
              <svg><use href="#i-close" /></svg>
            </button>
          </div>
        </div>
        <div class="drawer-tabs" id="drawerTabs"></div>
        <div class="drawer-body" id="drawerBody"></div>
      </section>
    </div>
    <div class="modal-root" id="modalRoot" hidden></div>
    <div class="toasts" id="toasts"></div>

    <!-- Core rendering libraries are bundled locally (approx. 56 KB): Markdown parsing and HTML sanitisation work fully offline. -->
    <script>
      window.AI_OFFLINE_VENDOR = false;
    </script>
    <!-- To make the optional enhancement libraries fully offline, place the files in vendor/ and set the flag above to true. -->
    <script defer src="vendor/marked.min.js"></script>
    <script defer src="vendor/purify.min.js"></script>

    <!-- Optional enhancement libraries (highlighting, formulas, diagrams, PDF,
     DOCX, QR codes) are loaded on demand by AI.loadLib with a timeout and
     graceful fallback; they never block first paint. Place the corresponding
     files in vendor/ to enable them fully offline. -->
    <script defer src="js/01-core.js"></script>
    <script defer src="js/02-providers.js"></script>
    <script defer src="js/03-tools.js"></script>
    <script defer src="js/04-render.js"></script>
    <script defer src="js/05-ui.js"></script>
    <script defer src="js/06-main.js"></script>
    <script defer src="js/07-extras.js"></script>
    <script defer src="js/08-i18n.js"></script>
    <script defer src="js/09-plus.js"></script>
  </body>
</html>
